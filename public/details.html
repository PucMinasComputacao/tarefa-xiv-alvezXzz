<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detalhes do Livro — Livraria Atlântica</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
 
  <!-- ===================== CABEÇALHO ===================== -->
  <header class="cabecalho">
    <div class="cabecalho-inner">
      <a href="index.html" class="logo">
        <span class="logo-principal">Livraria Atlântica</span>
        <span class="logo-sub">Est. desde 2024</span>
      </a>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html">Acervo</a></li>
          <li><a href="cadastro_livro.html">Cadastrar Livro</a></li>
        </ul>
      </nav>
    </div>
  </header>
 
  <!-- ===================== CONTEÚDO PRINCIPAL ===================== -->
  <main>
    <div class="detalhe-container">
 
      <!-- Link de voltar -->
      <a href="index.html" class="detalhe-voltar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 5l-7 7 7 7"/>
        </svg>
        Voltar ao acervo
      </a>
 
      <!-- Área de conteúdo dinâmico injetado pelo details.js -->
      <div id="detalhe-conteudo">
        <!-- Estado inicial: spinner de carregamento -->
        <div class="estado-carregando">
          <div class="estado-carregando-spinner"></div>
          <p>Carregando informações do livro…</p>
        </div>
      </div>
 
    </div>
  </main>
 
  <!-- ===================== RODAPÉ ===================== -->
  <footer class="rodape">
    <p>
      <strong>Livraria Atlântica</strong> &mdash;
      Atividade Prática: JSON Server &amp; Fetch API &mdash;
      Dados servidos por <code>localhost:3000</code>
    </p>
  </footer>
 
  <script src="details.js"></script>
</body>
</html>
